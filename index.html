<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <script>
      ;(() => {
        const umbrella = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="#070708"/><g transform="translate(100 100)"><path d="M0 0 0-82A82 82 0 0 1 58-58Z" fill="#d71920"/><path d="M0 0 58-58A82 82 0 0 1 82 0Z" fill="#ece9e5"/><path d="M0 0 82 0A82 82 0 0 1 58 58Z" fill="#d71920"/><path d="M0 0 58 58A82 82 0 0 1 0 82Z" fill="#ece9e5"/><path d="M0 0 0 82A82 82 0 0 1-58 58Z" fill="#d71920"/><path d="M0 0-58 58A82 82 0 0 1-82 0Z" fill="#ece9e5"/><path d="M0 0-82 0A82 82 0 0 1-58-58Z" fill="#d71920"/><path d="M0 0-58-58A82 82 0 0 1 0-82Z" fill="#ece9e5"/></g><circle cx="100" cy="100" r="15" fill="#070708"/></svg>`
        const assets = {
          'umbrella-mark.png': `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(umbrella)}`,
          'hero-rain-umbrella.jpg': 'https://images.unsplash.com/photo-1603222712687-f92e283c6b78?auto=format&fit=crop&w=2000&q=90',
          'review-man-umbrella.jpg': 'https://images.unsplash.com/photo-1519692933481-e162a57d6721?auto=format&fit=crop&w=1400&q=88',
          'world-map.jpg': 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Equirectangular_projection_SW.jpg/1920px-Equirectangular_projection_SW.jpg',
        }
        const resolveAssets = value => {
          if (typeof value !== 'string') return value
          for (const [name, source] of Object.entries(assets)) {
            if (value.includes(name)) value = value.replaceAll(new RegExp(`[^"'() ]*${name}`, 'g'), source)
          }
          return value
        }
        const imageSource = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src')
        Object.defineProperty(HTMLImageElement.prototype, 'src', {
          configurable: true,
          enumerable: imageSource.enumerable,
          get: imageSource.get,
          set(value) { imageSource.set.call(this, resolveAssets(value)) },
        })
        const setAttribute = Element.prototype.setAttribute
        Element.prototype.setAttribute = function (name, value) {
          return setAttribute.call(this, name, resolveAssets(value))
        }
        const setProperty = CSSStyleDeclaration.prototype.setProperty
        CSSStyleDeclaration.prototype.setProperty = function (name, value, priority) {
          return setProperty.call(this, name, resolveAssets(value), priority)
        }
      })()
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
